services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-cuentas-postgres
    environment:
      POSTGRES_DB: gestion_cuentas
      POSTGRES_USER: gestion_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_user -d gestion_cuentas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: gestion-cuentas-api
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gestion_cuentas
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: