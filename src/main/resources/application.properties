spring.application.name=trinity-financial

spring.datasource.url=jdbc:postgresql://localhost:5432/trinity_financial
spring.datasource.username=trinity_user
spring.datasource.password=trinity_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml